<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Minecraft Instance Manager</title>
  <rect width="128" height="128" rx="24" fill="#1E2128"/>
  <!-- An isometric block: three faces, the launcher's one recognisable shape. -->
  <g transform="translate(64 66)">
    <path d="M0-34 34-16 0 2-34-16Z" fill="#6FBF73"/>
    <path d="M-34-16 0 2 0 38-34 20Z" fill="#3E7A4B"/>
    <path d="M34-16 0 2 0 38 34 20Z" fill="#2E5C39"/>
  </g>
  <!-- A quiet accent bar, echoing the progress bar in the app. -->
  <rect x="34" y="104" width="60" height="6" rx="3" fill="#5B8DEF"/>
</svg>
